name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish as a release (leave empty to just build)
        required: false
        default: ''

env:
  # Set when this run should publish a release: a pushed v* tag, or the tag typed into a manual run.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}

jobs:
  build:
    # Pinned to VS 2022: its v143 (14.4x) toolset still produces exes that run on Windows 7.
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            vcvars: x64
          - arch: x86
            vcvars: x64_x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Build scamper-${{ matrix.arch }}.exe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} -vcvars_ver=14.4 || exit /b 1
          rc /nologo scamper.rc || exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX /DUNICODE /D_UNICODE /Fe:scamper-${{ matrix.arch }}.exe scamper.cpp scamper.res || exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: scamper-${{ matrix.arch }}
          path: scamper-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # --verify-tag refuses to create a tag, so a typo in the manual input fails instead.
        run: >
          gh release create "$RELEASE_TAG" dist/*.exe
          --repo "$REPO"
          --title "Scamper $RELEASE_TAG"
          --verify-tag
          --generate-notes
